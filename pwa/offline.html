<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Smart Plugs — Offline</title>
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #e2e8f0; background: #0f172a; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at top, #1e3a5f, #0f172a 55%); }
    main { width: min(28rem, calc(100% - 2rem)); text-align: center; }
    img { width: 8rem; height: 8rem; border-radius: 1.75rem; box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%); }
    h1 { margin: 1.5rem 0 .5rem; font-size: 2rem; letter-spacing: -.04em; }
    p { margin: 0 0 1.5rem; color: #94a3b8; line-height: 1.6; }
    button { border: 0; border-radius: .75rem; padding: .8rem 1.1rem; color: white; background: #2563eb; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="">
    <h1>You’re offline</h1>
    <p>Reconnect to the smart plug manager’s network to view and control your devices.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
