[package]
name = "smarthome-web"
version = "0.1.0"
authors = ["Iain H <iain@spiralpoint.org>"]
edition = "2018"

[lib]
name = "smarthome"

[dependencies]
axum = "0.8"
futures-executor = "0.3"
radiant = { git = "https://github.com/iainh/radiant" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "time"] }
