<article class="plug-card group-card">
  <div class="plug-heading">
    <div>
      <h3>{{ group.name }}</h3>
      <p class="model">{{ group.reachable_count }} of {{ group.member_count }} members reachable</p>
    </div>
    <span class="state {{ group.state_class }}">{{ group.state }}</span>
  </div>
  <p class="group-members">{{ group.members }}</p>
  {% if group.has_offline_members %}
    <p class="group-warning">Some members are unavailable. Reachable members can still be controlled.</p>
  {% endif %}
  <div class="group-relay-actions">
    <form hx-post="/groups/{{ group.id }}/relay" hx-target="#plug-list" hx-swap="outerHTML" hx-disabled-elt="find button">
      <button class="toggle" type="submit" name="on" value="true">Turn on</button>
    </form>
    <form hx-post="/groups/{{ group.id }}/relay" hx-target="#plug-list" hx-swap="outerHTML" hx-disabled-elt="find button">
      <button class="toggle toggle-off" type="submit" name="on" value="false">Turn off</button>
    </form>
  </div>
  <button class="small-button group-edit" type="button" hx-get="/groups/{{ group.id }}" hx-target="#device-pane" hx-swap="outerHTML" hx-disabled-elt="this">Edit group</button>
</article>
