<dialog id="device-pane" class="device-pane" aria-labelledby="timer-pane-title timer-pane-address">
  <div class="pane-header">
    <div>
      <h2 id="timer-pane-title">Countdown timer</h2>
      <span id="timer-pane-address" class="schedule-status">{panel.address}</span>
    </div>
    <button class="ui basic icon button pane-close" type="button" aria-label="Close timer pane" onclick="this.closest('dialog').close()"><i class="close icon" aria-hidden="true"></i></button>
  </div>

  {#for rule in panel.rules}
    <article class="ui fluid card timer-rule">
      <div class="content">
        <h3 class="header">{rule.name}</h3>
        <p class="description">{rule.action} in {rule.delay}{#if !rule.enabled} · Disabled{/if}</p>
      </div>
      {#if rule.id}
        <div class="extra content">
          <button class="ui fluid negative button small-button danger" type="button" hx-delete="/plugs/{panel.address}/countdown/{rule.id}" hx-target="closest .device-pane" hx-swap="outerHTML" hx-confirm="Cancel this timer?" hx-disable="this"><i class="stop circle outline icon" aria-hidden="true"></i>Cancel timer</button>
        </div>
      {/if}
    </article>
  {#else}
    <p class="schedule-status">No countdown timer is active.</p>
  {/for}

  <form class="ui form schedule-form" hx-post="/plugs/{panel.address}/countdown" hx-target="closest .device-pane" hx-swap="outerHTML" hx-disable="find button">
    <div class="field">
      <label for="countdown-minutes">After</label>
      <div class="ui right labeled input">
        <input id="countdown-minutes" name="minutes" type="number" min="1" max="1440" required value="30">
        <div class="ui basic label">minutes</div>
      </div>
    </div>
    <div class="field">
      <label for="countdown-action">Action</label>
      <select id="countdown-action" name="action">
        <option value="off">Turn off</option>
        <option value="on">Turn on</option>
      </select>
    </div>
    <button class="ui primary button small-button" type="submit"><i class="clock outline icon" aria-hidden="true"></i>Start timer</button>
  </form>
</dialog>
