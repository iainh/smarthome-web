<dialog id="device-pane" class="device-pane event-pane" aria-labelledby="event-pane-title">
  <div class="device-pane-resizer" role="separator" aria-label="Resize activity pane" aria-orientation="vertical" tabindex="0"></div>
  <div class="pane-header">
    <div>
      <h2 id="event-pane-title">Activity</h2>
      <span class="schedule-status">The 100 most recent control events</span>
    </div>
    <button class="ui basic icon button pane-close" type="button" aria-label="Close activity pane" onclick="this.closest('dialog').close()" autofocus><i class="close icon" aria-hidden="true"></i></button>
  </div>

  <button class="ui fluid button event-refresh" type="button" hx-get="/events" hx-target="closest .device-pane" hx-swap="outerHTML" hx-disabled-elt="this"><i class="sync alternate icon" aria-hidden="true"></i>Refresh activity</button>

  {% if events %}
    <ol class="event-list">
      {% for event in events %}
        <li class="event-item">
          <div class="event-meta">
            <span class="event-source event-source-{{ event.source | lower }}">{{ event.source }}</span>
            <time data-event-time="{{ event.occurred_at }}">Recently</time>
          </div>
          <p>{{ event.message }}</p>
        </li>
      {% endfor %}
    </ol>
  {% else %}
    <div class="event-empty">
      <i class="history icon" aria-hidden="true"></i>
      <strong>No activity yet</strong>
      <span>Relay, brightness, group, and automation changes will appear here.</span>
    </div>
  {% endif %}
</dialog>
