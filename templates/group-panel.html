<dialog id="device-pane" class="device-pane" aria-labelledby="group-pane-title group-pane-description">
  <div class="device-pane-resizer" role="separator" aria-label="Resize group pane" aria-orientation="vertical" tabindex="0"></div>
  <div class="pane-header">
    <div>
      <h2 id="group-pane-title">{% if panel.editing %}Edit group{% else %}Create group{% endif %}</h2>
      <span id="group-pane-description" class="schedule-status">Local device group</span>
    </div>
    <button class="ui basic icon button pane-close" type="button" aria-label="Close group pane" onclick="this.closest('dialog').close()"><i class="close icon" aria-hidden="true"></i></button>
  </div>

  <form class="ui form schedule-form" hx-post="{% if panel.editing %}/groups/{{ panel.id }}{% else %}/groups{% endif %}" hx-target="#plug-list" hx-swap="outerHTML" hx-disable="find button">
    <div class="field">
      <label for="group-name">Group name</label>
      <input id="group-name" name="name" maxlength="64" required value="{{ panel.name }}" placeholder="Living room" autofocus>
    </div>
    <fieldset class="ui segment group-membership">
      <legend>Devices</legend>
      {% for device in panel.devices %}
        <label class="group-device {% if not device.available %}group-device-offline{% endif %}">
          <input type="checkbox" name="{{ device.field_name }}" value="{{ device.device_id }}" {% if device.selected %}checked{% endif %}>
          <span>
            <strong>{{ device.alias }}</strong>
            <small>{% if device.available %}Available{% else %}Unavailable{% endif %}</small>
          </span>
        </label>
      {% else %}
        <p class="schedule-status">No devices remembered. Scan the network first.</p>
      {% endfor %}
    </fieldset>
    <button class="ui primary button small-button" type="submit"><i class="save outline icon" aria-hidden="true"></i>{% if panel.editing %}Save group{% else %}Create group{% endif %}</button>
  </form>

  {% if panel.editing %}
    <button class="ui fluid negative button small-button danger group-delete" type="button" hx-delete="/groups/{{ panel.id }}" hx-target="#plug-list" hx-swap="outerHTML" hx-confirm="Delete this group? Devices will not be removed." hx-disable="this"><i class="trash alternate outline icon" aria-hidden="true"></i>Delete group</button>
  {% endif %}
</dialog>
