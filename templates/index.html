<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasa Smart Plug Manager</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #1e3a5f, #0f172a 45%); }
    main { width: min(72rem, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: -0.04em; }
    .subtitle { margin: .35rem 0 0; color: #94a3b8; }
    button { border: 0; border-radius: .75rem; padding: .75rem 1rem; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, opacity .15s; }
    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .55; }
    .refresh { color: #0f172a; background: #e2e8f0; white-space: nowrap; }
    .plug-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; }
    .plug-card { display: grid; gap: 1rem; padding: 1.25rem; border: 1px solid #334155; border-radius: 1rem; background: rgb(15 23 42 / 78%); box-shadow: 0 1rem 2rem rgb(0 0 0 / 18%); }
    .plug-heading { display: flex; align-items: start; justify-content: space-between; gap: 1rem; }
    .plug-heading h2 { margin: 0; font-size: 1.15rem; }
    .model { margin: .2rem 0 0; color: #94a3b8; font-size: .85rem; }
    .state { border-radius: 999px; padding: .25rem .6rem; font-size: .75rem; font-weight: 800; text-transform: uppercase; }
    .state-on { color: #052e16; background: #86efac; }
    .state-off { color: #450a0a; background: #fca5a5; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: .35rem .75rem; margin: 0; font-size: .85rem; }
    dt { color: #94a3b8; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .toggle { width: 100%; color: #fff; background: #2563eb; }
    .toggle-off { background: #dc2626; }
    .device-details { border-top: 1px solid #334155; padding-top: .75rem; }
    .device-details dl { margin-top: .75rem; }
    .plug-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
    .plug-actions button { color: #cbd5e1; background: #334155; }
    .plug-actions .automation-button { color: #fff; background: #475569; }
    .device-pane { position: fixed; z-index: 10; inset: 0 0 0 auto; width: min(32rem, 100%); height: 100%; max-width: none; max-height: none; margin: 0 0 0 auto; overflow-y: auto; padding: 1.25rem; border: 0; border-left: 1px solid #334155; border-radius: 0; color: #e2e8f0; background: #0f172a; box-shadow: -1rem 0 3rem rgb(0 0 0 / 45%); }
    .device-pane::backdrop { background: rgb(2 6 23 / 68%); backdrop-filter: blur(2px); }
    .device-pane:not([open]) { display: none; }
    .pane-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .pane-header h2 { margin: 0; font-size: 1.3rem; }
    .pane-close { padding: .35rem .7rem; color: #cbd5e1; background: #334155; font-size: 1.4rem; line-height: 1; }
    .schedule-panel { display: grid; gap: .8rem; margin-top: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
    .schedule-header, .schedule-summary, .schedule-actions { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
    .schedule-header h3 { margin: 0; font-size: 1rem; }
    .schedule-status { color: #94a3b8; font-size: .8rem; }
    .schedule-rule { display: grid; gap: .6rem; padding: .8rem; border-radius: .75rem; background: #1e293b; }
    .schedule-rule h4 { margin: 0; font-size: .9rem; }
    .schedule-meta { margin: .15rem 0 0; color: #94a3b8; font-size: .78rem; }
    .small-button { padding: .45rem .65rem; color: #e2e8f0; background: #475569; font-size: .78rem; }
    .danger { background: #991b1b; }
    details { border-radius: .6rem; }
    summary { color: #cbd5e1; cursor: pointer; font-size: .82rem; font-weight: 700; }
    .device-pane details { padding: .75rem; border: 1px solid #334155; background: #111c30; }
    .device-pane details + details { margin-top: .65rem; }
    .device-pane summary { font-size: .9rem; }
    .schedule-form { display: grid; gap: .7rem; padding-top: .7rem; }
    .schedule-form > .small-button { color: #fff; background: #2563eb; }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
    label { display: grid; gap: .25rem; color: #94a3b8; font-size: .75rem; }
    input, select { width: 100%; border: 1px solid #475569; border-radius: .45rem; padding: .5rem; color: #e2e8f0; background: #0f172a; font: inherit; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: .25rem; }
    .weekday { display: grid; place-items: center; gap: .2rem; padding: .35rem 0; border: 1px solid #475569; border-radius: .4rem; color: #cbd5e1; }
    .weekday input { width: auto; margin: 0; }
    .advanced-note { margin: 0; color: #fbbf24; font-size: .75rem; }
    .timer-rule { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .8rem; border-radius: .75rem; background: #1e293b; }
    .timer-rule h3 { margin: 0; font-size: .9rem; }
    .timer-rule p { margin: .2rem 0 0; color: #94a3b8; font-size: .78rem; }
    .automation-intro { margin: 0; color: #94a3b8; font-size: .85rem; line-height: 1.5; }
    .automation-rules-header { margin-bottom: .75rem; }
    .weather-card { display: grid; gap: .75rem; margin: 1rem 0; padding: 1rem; border: 1px solid #334155; border-radius: .75rem; background: #1e293b; }
    .weather-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .weather-header h3 { margin: 0; font-size: 1rem; }
    .weather-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .weather-grid div { min-width: 0; }
    .weather-grid dt { font-size: .72rem; }
    .weather-grid dd { margin-top: .15rem; font-size: .9rem; font-weight: 700; }
    .light-chart { margin: .25rem 0 0; padding-top: .75rem; border-top: 1px solid #334155; }
    .light-chart figcaption { display: grid; gap: .15rem; margin-bottom: .35rem; }
    .light-chart figcaption strong { font-size: .85rem; }
    .light-chart figcaption span, .chart-legend { color: #94a3b8; font-size: .7rem; }
    .light-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-grid, .chart-axis { stroke: #475569; stroke-width: 1; }
    .chart-grid { stroke-dasharray: 2 3; }
    .chart-label { fill: #94a3b8; font-size: 8px; }
    .light-line { fill: none; stroke: #38bdf8; stroke-linejoin: round; stroke-width: 2.5; }
    .light-point { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1; }
    .solar-line { stroke-width: 1.5; stroke-dasharray: 4 3; }
    .sunrise-line, .sunrise-key { stroke: #fbbf24; background: #fbbf24; }
    .sunset-line, .sunset-key { stroke: #fb7185; background: #fb7185; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; padding-left: 2rem; }
    .chart-legend span { display: inline-flex; align-items: center; gap: .3rem; }
    .chart-legend i { width: .75rem; height: 2px; }
    .empty { padding: 3rem 1rem; border: 1px dashed #475569; border-radius: 1rem; color: #94a3b8; text-align: center; }
    .htmx-request .button-label { opacity: .5; }
    @media (max-width: 36rem) {
      header { align-items: stretch; flex-direction: column; }
      .plug-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Smart plugs</h1>
        <p class="subtitle">Discover and control Kasa plugs on your local network.</p>
      </div>
      <button class="refresh" hx-post="/refresh" hx-target="#plug-list" hx-swap="outerHTML" hx-disabled-elt="this">
        <span class="button-label">Refresh devices</span>
      </button>
    </header>
    {% include "plug-list.html" %}
  </main>
  <dialog id="device-pane" class="device-pane" aria-label="Device controls"></dialog>
  <script>
    document.body.addEventListener("htmx:responseError", function (event) {
      window.alert(event.detail.xhr.responseText || "The device request failed.");
    });
    document.body.addEventListener("htmx:afterSwap", function (event) {
      if (event.detail.target.id === "device-pane") {
        document.getElementById("device-pane").showModal();
      }
    });
  </script>
</body>
</html>
