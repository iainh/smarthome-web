    .light-chart figcaption { display: grid; gap: .15rem; margin-bottom: .35rem; }
    .light-chart figcaption strong { font-size: .85rem; }
    .light-chart figcaption span, .chart-legend { color: var(--muted); font-size: .7rem; }
    .light-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-grid, .chart-axis { stroke: var(--chart-grid); stroke-width: 1; }
    .chart-grid { stroke-dasharray: 2 3; }
    .chart-label { fill: var(--muted); font-size: 8px; }
    .light-average-line { fill: none; stroke: var(--chart-average); stroke-dasharray: 4 3; stroke-linejoin: round; stroke-width: 3; }
    .light-line { fill: none; stroke: #38bdf8; stroke-linejoin: round; stroke-width: 2.5; }
    .light-point { fill: #bae6fd; stroke: #0c4a6e; stroke-width: 1; }
    .solar-line { stroke-width: 1.5; stroke-dasharray: 4 3; }
    .sunrise-line, .sunrise-key { stroke: #fbbf24; background: #fbbf24; }
    .sunset-line, .sunset-key { stroke: #fb7185; background: #fb7185; }
    .light-average-key { border-top: 2px dashed var(--chart-average); }
    .chart-legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; padding-left: 2rem; }
    .chart-legend span { display: inline-flex; align-items: center; gap: .3rem; }
    .chart-legend i { width: .75rem; height: 2px; }
    .light-rule-details[open] { padding: 1rem; }
    .light-rule-intro { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.45; }
    .rule-section { display: grid; gap: .65rem; min-width: 0; margin: 0; padding: .8rem 0 0; border: 0; border-top: 1px solid var(--border); }
    .rule-section legend { padding: 0; color: var(--foreground); font-size: .9rem; font-weight: 800; }
    .unit-input { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    .unit-input input { border-radius: .45rem 0 0 .45rem; }
    .unit-input > span { display: grid; place-items: center; padding: 0 .55rem; border: 1px solid var(--strong-border); border-left: 0; border-radius: 0 .45rem .45rem 0; color: var(--subtle-foreground); background: var(--control-surface); font-size: .72rem; font-weight: 700; }
    .threshold-scale { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 2px; overflow: hidden; border-radius: .5rem; color: var(--subtle-foreground); background: var(--border); font-size: .7rem; text-align: center; }
    .threshold-scale > span { display: grid; gap: .12rem; padding: .45rem .2rem; background: var(--detail-surface); }
    .threshold-scale .threshold-on { border-top: 3px solid #2563eb; }
    .threshold-scale .threshold-hold { border-top: 3px solid #64748b; }
    .threshold-scale .threshold-off { border-top: 3px solid #38bdf8; }
    .threshold-scale small { color: var(--muted); font-size: .65rem; }
    .window-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .45rem; }
    .boundary-card { display: grid; gap: .5rem; min-width: 0; padding: .65rem; border: 1px solid var(--border); border-radius: .6rem; background: var(--raised-surface); }
    .boundary-card > strong { color: var(--subtle-foreground); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }
    .window-arrow { color: var(--muted); font-size: 1.25rem; }
    .window-preview { margin: 0; padding: .7rem; border: 1px solid #1d4ed8; border-radius: .55rem; color: #bfdbfe; background: rgb(30 64 175 / 18%); font-size: .76rem; line-height: 1.4; }
    :root[data-theme="light"] .window-preview { color: #1e3a8a; background: #eff6ff; }
    .device-pane .advanced-timing { margin: 0; padding: .6rem .7rem; background: var(--raised-surface); }
    .device-pane .advanced-timing p { margin: .5rem 0 0; color: var(--muted); font-size: .72rem; line-height: 1.4; }
    .outside-window-options { gap: .5rem; }
    .radio-card { display: flex; grid-template-columns: none; align-items: flex-start; gap: .6rem; padding: .65rem; border: 1px solid var(--border); border-radius: .6rem; background: var(--raised-surface); cursor: pointer; }
    .radio-card:has(input:checked) { border-color: #2563eb; background: rgb(30 64 175 / 14%); }
    .radio-card input { width: auto; margin-top: .2rem; accent-color: #2563eb; }
    .radio-card span { display: grid; gap: .15rem; }
    .radio-card strong { color: var(--foreground); font-size: .78rem; }
    .radio-card small { color: var(--muted); font-size: .68rem; line-height: 1.35; }
    .light-rule-actions { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .5rem; }
    .light-rule-actions .secondary-button { color: var(--subtle-foreground); background: var(--control-surface); }
    .plug-migration { display: grid; gap: .65rem; margin-top: 1rem; padding: 1rem; border: 1px solid #92400e; border-radius: .75rem; background: rgb(120 53 15 / 12%); }
    .migration-button { width: 100%; background: #2563eb; }
    .empty { padding: 3rem 1rem; border: 1px dashed var(--strong-border); border-radius: 1rem; color: var(--muted); text-align: center; }
    .htmx-request .button-label { opacity: .5; }
    @media (max-width: 36rem) {
      header { align-items: stretch; flex-direction: column; }
      .header-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .theme-toggle { grid-column: 1 / -1; }
      .plug-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .device-pane-resizer { display: none; }
      .week-calendar { padding: .75rem; }
      .week-calendar-header { align-items: stretch; flex-direction: column; }
      .calendar-view-toggle { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .calendar-day-picker { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .2rem; }
      .calendar-day-button { display: grid; place-items: center; min-width: 0; min-height: 44px; padding: .3rem .05rem; border: 1px solid var(--border); border-radius: .4rem; color: var(--muted); background: var(--raised-surface); font-size: .6rem; }
      .calendar-day-button small { font-size: .48rem; }
      .calendar-day-button.active { border-color: #3b82f6; color: #eff6ff; background: #2563eb; }
      .calendar-axis { margin-left: 2.75rem; }
      .calendar-day:not(.calendar-mobile-selected) { display: none; }
      .calendar-day { grid-template-columns: 2.25rem minmax(0, 1fr); gap: .3rem; }
      .calendar-entry > span { font-size: .52rem; }
      .week-calendar[data-calendar-view="state"] .calendar-point > span { font-size: .44rem; }
      .window-flow { grid-template-columns: 1fr; }
      .window-arrow { justify-self: center; transform: rotate(90deg); }
    }
    /* Apply the app theme to reusable Semantic UI components. */
    .ui.segment, .ui.card, .ui.message { color: var(--foreground); border-color: var(--border); background: var(--surface); }
    .ui.segment { box-shadow: 0 1px 2px var(--shadow); }
    .ui.message > .header, .ui.card > .content > .header { color: var(--foreground); }
    .ui.message p, .ui.card > .content > .description, .ui.card > .content > .meta { color: var(--muted); }
    .ui.form .field > label, .ui.form label { color: var(--muted); }
    .ui.form input:not([type]), .ui.form input[type="text"], .ui.form input[type="time"],
    .ui.form input[type="number"], .ui.form select {
      color: var(--foreground);
      border-color: var(--strong-border);
      background: var(--input-surface);
    }
    .ui.form input:focus, .ui.form select:focus { color: var(--foreground); border-color: #2185d0; background: var(--input-surface); }
    .ui.button { font-family: inherit; }
    .ui.basic.button { color: var(--foreground) !important; box-shadow: 0 0 0 1px var(--strong-border) inset; }
    .ui.basic.button:hover { color: var(--foreground) !important; background: var(--raised-surface) !important; }
    .ui.cards.plug-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; margin: 0; }
    .ui.cards.plug-grid::after { display: none; }
    .ui.cards.plug-grid > .ui.card { width: 100%; margin: 0; }
    .ui.card.plug-card { border: 1px solid var(--border); border-radius: 1rem; background: var(--surface); box-shadow: 0 1rem 2rem var(--shadow); }
    .ui.card.plug-card > .content, .ui.card.plug-card > .extra.content,
    .ui.card.timer-rule > .content, .ui.card.timer-rule > .extra.content,
    .ui.card.schedule-rule > .content { border-color: var(--border); background: transparent; }
    .ui.card.weather-card { width: 100%; margin: 1rem 0; background: var(--surface); }
    .ui.card.weather-card .weather-grid { margin-top: .75rem; }
    .ui.card.timer-rule, .ui.card.schedule-rule { width: 100%; background: var(--raised-surface); }
    .ui.segment.week-calendar { background: var(--surface); }
    .ui.label.state.state-on { color: #052e16; background: #86efac; }
    .ui.label.state.state-off { color: #450a0a; background: #fca5a5; }
    .ui.label.state.state-mixed { color: #422006; background: #fde68a; }
    .ui.label.state.state-unavailable { color: #fff; background: #475569; }
    .ui.label.state { margin: 0; }
  </style>
</head>
<body>
  <main class="ui container app-container">
    <header>
      <div>
        <h1>Smart plugs</h1>
        <p class="subtitle">Remember and control Kasa plugs on your local network.</p>
      </div>
      <div class="header-actions">
        <button class="ui basic button install-app" type="button" hidden><i class="download icon" aria-hidden="true"></i>Install app</button>
        <button class="ui basic button theme-toggle" type="button">
          <i class="adjust icon" aria-hidden="true"></i>
          <span class="theme-label">Switch to dark theme</span>
        </button>
        <button class="ui primary button add-group" type="button" hx-get="/groups/new" hx-target="#device-pane" hx-swap="outerHTML" hx-disabled-elt="this">
          <i class="users icon" aria-hidden="true"></i>
          <span class="button-label">Add group</span>
        </button>
        <button class="ui button scan" hx-post="/scan" hx-target="#plug-list" hx-swap="outerHTML" hx-disabled-elt="this">
          <i class="search icon" aria-hidden="true"></i>
          <span class="button-label">Scan for devices</span>
        </button>
      </div>
    </header>
    {% include "plug-list.html" %}
  </main>
  <dialog id="device-pane" class="device-pane" aria-label="Device controls"></dialog>
  <script>
    const paneWidthKey = "kasa-device-pane-width";
    const themeKey = "kasa-theme";
    const installButton = document.querySelector(".install-app");
    let installPrompt = null;
    let resizingPane = null;

    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === "dark";
      document.querySelector(".theme-label").textContent = dark ? "Switch to light theme" : "Switch to dark theme";
      document.getElementById("theme-color").content = dark ? "#0f172a" : "#f8fafc";
    }

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = false;
    });
    window.addEventListener("appinstalled", function () {
      installPrompt = null;
      installButton.hidden = true;
    });
    installButton.addEventListener("click", async function () {
      if (!installPrompt) return;
      await installPrompt.prompt();
      installPrompt = null;
      installButton.hidden = true;
    });

    document.querySelector(".theme-toggle").addEventListener("click", function () {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      try {
        window.localStorage.setItem(themeKey, theme);
      } catch (_) {}
      updateThemeButton();
    });
    updateThemeButton();

    function setPaneWidth(pane, requestedWidth) {
      const minimumWidth = Math.min(320, window.innerWidth);
      const width = Math.min(window.innerWidth, Math.max(minimumWidth, requestedWidth));
      pane.style.width = width + "px";
      const resizer = pane.querySelector(".device-pane-resizer");
      if (resizer) {
        resizer.setAttribute("aria-valuemin", minimumWidth);
        resizer.setAttribute("aria-valuemax", window.innerWidth);
        resizer.setAttribute("aria-valuenow", Math.round(width));
      }
    }

    function restorePaneWidth(pane) {
      let savedWidth = 0;
      try {
        savedWidth = Number(window.localStorage.getItem(paneWidthKey));
      } catch (_) {}
      setPaneWidth(pane, savedWidth > 0 ? savedWidth : pane.getBoundingClientRect().width);
    }

    function savePaneWidth(pane) {
      try {
        window.localStorage.setItem(paneWidthKey, Math.round(pane.getBoundingClientRect().width));
      } catch (_) {}
    }

    document.body.addEventListener("htmx:responseError", function (event) {
      window.alert(event.detail.xhr.responseText || "The device request failed.");
    });
    document.body.addEventListener("htmx:afterSwap", function (event) {
      if (event.detail.target.id === "device-pane") {
        const pane = document.getElementById("device-pane");
        restorePaneWidth(pane);
        pane.showModal();
        initializeSemanticControls(pane);
        pane.querySelectorAll(".light-rule-form").forEach(updateLightRuleForm);
      }
    });

    function formatFormTime(value) {
      const parts = value.split(":");
      if (parts.length !== 2) return value;
      const hour = Number(parts[0]);
      const suffix = hour < 12 ? "AM" : "PM";
      return (hour % 12 || 12) + ":" + parts[1] + " " + suffix;
    }

    function boundaryDescription(form, boundary) {
      const card = form.querySelector('[data-boundary="' + boundary + '"]');
      const kind = card.querySelector(".boundary-kind").value;
      card.querySelector(".boundary-time-control").hidden = kind !== "fixed";
      card.querySelector(".boundary-offset-control").hidden = kind === "fixed";
      if (kind === "fixed") {
        return formatFormTime(card.querySelector('input[type="time"]').value);
      }
      const offset = Number(card.querySelector('input[type="number"]').value);
      let description = kind;
      if (offset < 0) description = Math.abs(offset) + " min before " + kind;
      if (offset > 0) description = offset + " min after " + kind;
      const today = form.dataset[kind];
      return today ? description + " (today: " + today + ")" : description;
    }

    function updateLightRuleForm(form) {
      const onBelow = form.elements.on_below.value;
      const offAbove = form.elements.off_above.value;
      form.querySelectorAll(".on-threshold-output").forEach(function (output) {
        output.value = onBelow;
      });
      form.querySelectorAll(".off-threshold-output").forEach(function (output) {
        output.value = offAbove;
      });
      const windowEnabled = form.elements.window_enabled.checked;
      form.querySelectorAll(".window-flow, .window-preview, .advanced-timing, .outside-window-options").forEach(function (control) {
        control.hidden = !windowEnabled;
      });
      if (!windowEnabled) return;
      const start = boundaryDescription(form, "start");
      const end = boundaryDescription(form, "end");
      form.querySelector(".window-preview").textContent =
        "Active daily from " + start + " until " + end + ".";
    }

    function initializeSemanticControls(root) {
      $(root).find(".schedule-add-dropdown").dropdown({
        action: "hide",
        onChange: function (value) {
          if (value) openAddSchedule(value);
        }
      });
    }

    function setCalendarView(button, view) {
      const calendar = button.closest(".week-calendar");
      calendar.dataset.calendarView = view;
      calendar.querySelectorAll(".calendar-view-button").forEach(function (viewButton) {
        const selected = viewButton.dataset.view === view;
        viewButton.classList.toggle("active", selected);
        viewButton.setAttribute("aria-pressed", String(selected));
      });
    }

    function setCalendarDay(button, day) {
      const calendar = button.closest(".week-calendar");
      calendar.querySelectorAll(".calendar-day-button").forEach(function (dayButton) {
        const selected = Number(dayButton.dataset.calendarDay) === day;
        dayButton.classList.toggle("active", selected);
        dayButton.setAttribute("aria-pressed", String(selected));
      });
      calendar.querySelectorAll(".calendar-day").forEach(function (dayView) {
        dayView.classList.toggle("calendar-mobile-selected", Number(dayView.dataset.calendarDay) === day);
      });
    }

    function selectCalendarEntry(entry) {
      const calendar = entry.closest(".week-calendar");
      const selection = calendar.querySelector(".calendar-selection");
      if (selection.dataset.ruleId !== entry.dataset.ruleId) restoreCalendarEditor(calendar);
      calendar.querySelectorAll("[data-calendar-entry]").forEach(function (candidate) {
        candidate.setAttribute("aria-pressed", String(candidate === entry));
      });
      selection.hidden = false;
      selection.dataset.ruleId = entry.dataset.ruleId;
      selection.dataset.enabled = entry.dataset.enabled;
      selection.querySelector(".calendar-selection-name").textContent = entry.dataset.name;
      selection.querySelector(".calendar-selection-detail").textContent = entry.dataset.detail;
      selection.querySelector(".calendar-winner-badge").hidden = entry.dataset.winner !== "true";
      const enabledButton = selection.querySelector(".calendar-enabled-button");
      const enabled = entry.dataset.enabled === "true";
      enabledButton.textContent = enabled ? "Disable rule" : "Enable rule";
      enabledButton.classList.toggle("danger", enabled);
    }

    function restoreCalendarEditor(calendar) {
      const host = calendar.querySelector(".calendar-inline-editor");
      const editor = host.querySelector(".schedule-editor");
      if (editor) {
        const pane = calendar.closest(".device-pane");
        const placeholder = pane.querySelector('[data-calendar-editor-placeholder="' + editor.id + '"]');
        editor.open = false;
        if (placeholder) placeholder.replaceWith(editor);
      }
      host.hidden = true;
      calendar.querySelector(".calendar-edit-button").textContent = "Edit rule";
    }

    function editSelectedCalendarRule(button) {
      const selection = button.closest(".calendar-selection");
      const calendar = selection.closest(".week-calendar");
      const host = selection.querySelector(".calendar-inline-editor");
      const current = host.querySelector(".schedule-editor");
      const editorId = "schedule-editor-" + selection.dataset.ruleId;
      if (current && current.id === editorId) {
        restoreCalendarEditor(calendar);
        return;
      }
      restoreCalendarEditor(calendar);
      const editor = document.getElementById(editorId);
      if (!editor) return;
      const placeholder = document.createElement("span");
      placeholder.hidden = true;
      placeholder.dataset.calendarEditorPlaceholder = editor.id;
      editor.before(placeholder);
      host.append(editor);
      host.hidden = false;
      editor.open = true;
      button.textContent = "Close editor";
    }

    function setSelectedCalendarRuleEnabled(button) {
      const selection = button.closest(".calendar-selection");
      const calendar = selection.closest(".week-calendar");
      const enabled = selection.dataset.enabled === "true";
      button.disabled = true;
      htmx.ajax("POST", calendar.dataset.automationBase + "/" + selection.dataset.ruleId + "/enabled", {
        target: "#device-pane",
        swap: "outerHTML",
        values: { on: String(!enabled) }
      }).catch(function () {
        button.disabled = false;
      });
    }

    function deleteSelectedCalendarRule(button) {
      if (!window.confirm("Delete this schedule?")) return;
      const selection = button.closest(".calendar-selection");
      const calendar = selection.closest(".week-calendar");
      button.disabled = true;
      htmx.ajax("DELETE", calendar.dataset.automationBase + "/" + selection.dataset.ruleId, {
        target: "#device-pane",
        swap: "outerHTML"
      }).catch(function () {
        button.disabled = false;
      });
    }

    function openScheduleAddMenu() {
      const dropdown = document.querySelector(".schedule-add-dropdown");
      if (!dropdown) return;
      const control = dropdown.closest(".schedule-add-control");
      control.querySelectorAll(".schedule-add-form[open]").forEach(function (form) {
        form.open = false;
      });
      $(dropdown).dropdown("show");
      control.scrollIntoView({ behavior: "smooth", block: "center" });
      dropdown.focus({ preventScroll: true });
    }

    function openAddSchedule(id) {
      const form = document.getElementById(id);
      if (!form) return;
      const control = form.closest(".schedule-add-control");
      control.querySelectorAll(".schedule-add-form[open]").forEach(function (openForm) {
        openForm.open = false;
      });
      $(control.querySelector(".schedule-add-dropdown")).dropdown("hide");
      form.open = true;
      form.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.body.addEventListener("click", function (event) {
      const pane = event.target.closest(".device-pane");
      if (pane && event.target === pane) {
        const bounds = pane.getBoundingClientRect();
        const outside = event.clientX < bounds.left
          || event.clientX > bounds.right
          || event.clientY < bounds.top
          || event.clientY > bounds.bottom;
        if (outside) {
          pane.close();
          return;
        }
      }
      const entry = event.target.closest("[data-calendar-entry]");
      if (entry) selectCalendarEntry(entry);
    });
    document.body.addEventListener("input", function (event) {
      const form = event.target.closest(".light-rule-form");
      if (form) updateLightRuleForm(form);
    });
    document.body.addEventListener("change", function (event) {
      const form = event.target.closest(".light-rule-form");
      if (form) updateLightRuleForm(form);
    });
    document.body.addEventListener("reset", function (event) {
      if (event.target.matches(".light-rule-form")) {
        window.setTimeout(function () { updateLightRuleForm(event.target); });
      }
    });

    document.body.addEventListener("pointerdown", function (event) {
      const resizer = event.target.closest(".device-pane-resizer");
      if (!resizer) return;
      resizingPane = resizer.closest(".device-pane");
      resizer.setPointerCapture(event.pointerId);
      document.body.classList.add("resizing-pane");
      event.preventDefault();
    });
    document.body.addEventListener("pointermove", function (event) {
      if (resizingPane) setPaneWidth(resizingPane, window.innerWidth - event.clientX);
    });
    function finishPaneResize() {
      if (!resizingPane) return;
      savePaneWidth(resizingPane);
      resizingPane = null;
      document.body.classList.remove("resizing-pane");
    }
    document.body.addEventListener("pointerup", finishPaneResize);
    document.body.addEventListener("pointercancel", finishPaneResize);
    document.body.addEventListener("keydown", function (event) {
      if (!event.target.matches(".device-pane-resizer")) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const pane = event.target.closest(".device-pane");
      const adjustment = event.key === "ArrowLeft" ? 24 : -24;
      setPaneWidth(pane, pane.getBoundingClientRect().width + adjustment);
      savePaneWidth(pane);
      event.preventDefault();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function (error) {
          console.warn("Service worker registration failed", error);
        });
      });
    }
  </script>
</body>
</html>
