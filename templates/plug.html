<article class="plug-card">
  <div class="plug-heading">
    <div>
      <h2>{{ plug.alias }}</h2>
      <p class="model">{{ plug.model }}</p>
    </div>
    <div class="plug-heading-actions">
      {% if plug.relay_on %}
        <span class="state state-on">On</span>
      {% else %}
        <span class="state state-off">Off</span>
      {% endif %}
      <button class="remove-device" type="button" aria-label="Remove {{ plug.alias }} from inventory" title="Remove device" hx-delete="/devices/{{ plug.device_id }}" hx-target="#plug-list" hx-swap="outerHTML" hx-confirm="Remove this device from the remembered inventory? A later scan can add it again." hx-disabled-elt="this">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      </button>
    </div>
  </div>
  <details class="device-details">
    <summary>Device details</summary>
    <dl>
      <dt>Address</dt><dd>{{ plug.address }}</dd>
      <dt>Software</dt><dd>{{ plug.software_version }}</dd>
      <dt>Device ID</dt><dd>{{ plug.device_id }}</dd>
    </dl>
  </details>
  <form hx-post="/plugs/{{ plug.address }}/relay" hx-target="#plug-list" hx-swap="outerHTML" hx-disabled-elt="find button">
    {% if plug.relay_on %}
      <button class="toggle toggle-off" type="submit" name="on" value="false"><span class="button-label">Turn off</span></button>
    {% else %}
      <button class="toggle" type="submit" name="on" value="true"><span class="button-label">Turn on</span></button>
    {% endif %}
  </form>
  <div class="plug-actions">
    <button class="automation-button" type="button" hx-get="/plugs/{{ plug.address }}/automations" hx-target="#device-pane" hx-swap="outerHTML" hx-disabled-elt="this">
      <span class="button-label">Automations</span>
    </button>
    <button type="button" hx-get="/plugs/{{ plug.address }}/countdown" hx-target="#device-pane" hx-swap="outerHTML" hx-disabled-elt="this">
      <span class="button-label">Set timer</span>
    </button>
  </div>
</article>
