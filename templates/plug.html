<article class="ui fluid card plug-card">
  <div class="content">
    <div class="right floated plug-heading-actions">
      {#if plug.relay_on}
        <span class="ui mini green label state state-on">On</span>
      {#else}
        <span class="ui mini red label state state-off">Off</span>
      {/if}
      <button class="ui basic icon button remove-device" type="button" aria-label="Remove {plug.alias} from inventory" title="Remove device" hx-delete="/devices/{plug.device_id}" hx-target="#plug-list" hx-swap="outerHTML" hx-confirm="Remove this device from the remembered inventory? A later scan can add it again." hx-disable="this">
        <i class="trash alternate outline icon" aria-hidden="true"></i>
      </button>
    </div>
    <h2 class="header">{plug.alias}</h2>
    <p class="meta model">{plug.model}</p>
    <details class="device-details">
      <summary>Device details</summary>
      <dl>
        <dt>Address</dt><dd>{plug.address}</dd>
        <dt>Software</dt><dd>{plug.software_version}</dd>
        <dt>Device ID</dt><dd>{plug.device_id}</dd>
      </dl>
    </details>
  </div>
  <div class="content">
    {#if plug.brightness}
      <form class="dimmer-control" hx-post="/plugs/{plug.address}/brightness" hx-trigger="change" hx-target="#plug-list" hx-swap="outerHTML" hx-disable="find input">
        <label for="brightness-{plug.address}">
          <span>Brightness</span>
          <output for="brightness-{plug.address}">{plug.brightness ?: ''}%</output>
        </label>
        <input id="brightness-{plug.address}" type="range" name="brightness" min="1" max="100" value="{plug.brightness ?: ''}" aria-label="Brightness for {plug.alias}" oninput="this.previousElementSibling.querySelector('output').value = this.value + '%'">
      </form>
    {/if}
    <form hx-post="/plugs/{plug.address}/relay" hx-target="#plug-list" hx-swap="outerHTML" hx-disable="find button">
      {#if plug.relay_on}
        <button class="ui fluid negative button toggle toggle-off" type="submit" name="on" value="false"><i class="power off icon" aria-hidden="true"></i><span class="button-label">Turn off</span></button>
      {#else}
        <button class="ui fluid primary button toggle" type="submit" name="on" value="true"><i class="power off icon" aria-hidden="true"></i><span class="button-label">Turn on</span></button>
      {/if}
    </form>
  </div>
  <div class="extra content">
    <div class="plug-actions">
      <button class="ui button automation-button" type="button" hx-get="/plugs/{plug.address}/automations" hx-target="#device-pane" hx-swap="outerHTML" hx-disable="this">
        <i class="calendar alternate outline icon" aria-hidden="true"></i>
        <span class="button-label">Automations</span>
      </button>
      <button class="ui button" type="button" hx-get="/plugs/{plug.address}/countdown" hx-target="#device-pane" hx-swap="outerHTML" hx-disable="this">
        <i class="clock outline icon" aria-hidden="true"></i>
        <span class="button-label">Set timer</span>
      </button>
    </div>
  </div>
</article>
